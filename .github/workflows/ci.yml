name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} / Typst ${{ matrix.typst }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        typst: ['0.15.1']
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: 'true'
      TYPSTIUM_REQUIRE_TYPST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: ${{ matrix.typst }}
      - run: typst --version
      - run: dotnet build --configuration Release
      # One test module at a time: the integration tests time CPU-bound compiles, and on a 2-vCPU runner
      # the net472 and net10.0 assemblies running together starve each other of CPU.
      - run: dotnet test --configuration Release --no-build --max-parallel-test-modules 1

  latest-typst:
    name: Early warning / latest Typst
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      DOTNET_NOLOGO: 'true'
      TYPSTIUM_REQUIRE_TYPST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: latest
      - run: typst --version
      - run: dotnet build --configuration Release
      # One test module at a time: the integration tests time CPU-bound compiles, and on a 2-vCPU runner
      # the net472 and net10.0 assemblies running together starve each other of CPU.
      - run: dotnet test --configuration Release --no-build --max-parallel-test-modules 1
