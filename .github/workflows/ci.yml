name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} / Typst ${{ matrix.typst }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        typst: ['0.15.1']
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: 'true'
      TYPSTIUM_REQUIRE_TYPST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: ${{ matrix.typst }}
      - run: typst --version
      # The same steps as a local run: build, unit, integration, then the timing tests alone. -Coverage prints this
      # platform's coverage tables to the log; the coverage job below merges both platforms for the job summary.
      - run: ./build.ps1 -Coverage -NoJobSummary
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: artifacts/coverage/raw/*.cobertura.xml
          if-no-files-found: error
          retention-days: 7

  # One coverage report for the run: code counts as covered when either platform ran it (Unix-only code on Ubuntu,
  # Windows-only code such as job objects on Windows). Runs only when both platforms passed.
  coverage:
    name: Coverage (Windows + Ubuntu)
    needs: build
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: artifacts/coverage/raw
          merge-multiple: true
      - run: ./build.ps1 -CoverageReportOnly
        shell: pwsh

  latest-typst:
    name: Early warning / latest Typst
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      DOTNET_NOLOGO: 'true'
      TYPSTIUM_REQUIRE_TYPST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: latest
      - run: typst --version
      # The same steps as a local run: build, unit, integration, then the timing tests alone.
      - run: ./build.ps1
        shell: pwsh
