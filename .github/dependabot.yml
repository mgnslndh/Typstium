# Weekly, grouped dependency updates, so a few pull requests arrive instead of one per package.
# Major versions of the runtime packages and the SDK are deliberate decisions, not automatic updates: the library
# targets netstandard2.0 and net8.0, and a System.* 11.x dependency would force consumers onto it.
version: 2
updates:
  # CI's actions are pinned to commit SHAs with the version in a comment; Dependabot updates both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']

  # Directory.Packages.props (central package management).
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      tunit:
        patterns: ['TUnit*']
      runtime-packages:
        patterns: ['System.*', 'Microsoft.Bcl.*']
      build-tooling:
        patterns: ['Polyfill', 'Microsoft.CodeAnalysis.*', 'ReportGenerator.Core']
      # The build (build/): Cake.Sdk in global.json's msbuild-sdks, the Cake packages and Spectre.Console move together.
      # Spectre.Console is pre-1.0 and Cake.Cli is compiled against it; build/Build fails (NU1605) when Cake needs a
      # newer one than Directory.Packages.props pins.
      cake:
        patterns: ['Cake.*', 'Spectre.Console*']
    ignore:
      # Cake.Typstium builds against the first Cake 6 on purpose, so every Cake 6.x can load it (docs/specs/cake.md §3);
      # moving it is a decision. Cake.Common and Cake.Testing still follow Cake.Sdk.
      - dependency-name: 'Cake.Core'
      - dependency-name: 'System.*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'Microsoft.Bcl.*'
        update-types: ['version-update:semver-major']

  # global.json: stays on the .NET 10 SDK band until moving is decided.
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
