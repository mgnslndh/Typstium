# Weekly, grouped dependency updates, so a few pull requests arrive instead of one per package.
# Major versions of the runtime packages and the SDK are deliberate decisions, not automatic updates: the library
# targets netstandard2.0 and net8.0, and a System.* 11.x dependency would force consumers onto it.
version: 2
updates:
  # CI's actions are pinned to commit SHAs with the version in a comment; Dependabot updates both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']

  # Directory.Packages.props (central package management).
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      tunit:
        patterns: ['TUnit*']
      runtime-packages:
        patterns: ['System.*', 'Microsoft.Bcl.*']
      build-tooling:
        patterns: ['Polyfill', 'Microsoft.CodeAnalysis.*']
    ignore:
      - dependency-name: 'System.*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'Microsoft.Bcl.*'
        update-types: ['version-update:semver-major']

  # global.json: stays on the .NET 10 SDK band until moving is decided.
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
